<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="HireIQ - AI-Powered Hiring Assistant">
    <title>{% block title %}HireIQ - AI Hiring Assistant{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-wrapper">
                    <div class="logo-icon">
                        <div class="logo-outer"></div>
                        <div class="logo-inner"></div>
                    </div>
                    <div class="logo-text">
                        <span class="logo-hire">Hire</span><span class="logo-iq">IQ</span>
                    </div>
                </div>
                <div class="logo-subtitle">
                    <div class="subtitle-line1">AI-Powered</div>
                    <div class="subtitle-line2">Hiring Assistant</div>
                </div>
            </div>

            <div class="nav-header">Navigation</div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">
                        <span class="nav-icon">▶</span>
                        Home
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/cv-screening" class="nav-link {% if active_page == 'cv_screening' %}active{% endif %}">
                        <span class="nav-icon">◆</span>
                        CV Screening
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                        <span class="nav-icon">○</span>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/interview" class="nav-link {% if active_page == 'interview' %}active{% endif %}">
                        <span class="nav-icon">●</span>
                        Interview Questions
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/bias-detector" class="nav-link {% if active_page == 'bias_detector' %}active{% endif %}">
                        <span class="nav-icon">◇</span>
                        Bias Detector
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span class="status-text">System Online</span>
                </div>
                <div class="footer-credit">Powered by AI & Hugging Face</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
